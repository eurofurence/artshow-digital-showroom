{{define "dialog"}}
<dialog id="media-dialog">
  <div class="dialog-content">

    <div class="dialog-preview">
      <img id="dialog-image" src="" alt="">
    </div>

    <div class="dialog-details">
      <h2 id="dialog-title"></h2>

      <p>
        <strong id="dialog-creator"></strong>
      </p>

      <p id="dialog-description" class="description"></p>

      <button>
        Play
      </button>
    </div>

  </div>
</dialog>
{{end}}
