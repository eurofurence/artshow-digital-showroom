{{define "dialog"}}
<dialog id="media-dialog">
  <div class="dialog-content">

    <div class="dialog-preview">
      <video id="dialog-video" controls autoplay muted>
        <source id="dialog-video-source" src="" type="video/mp4">
        Your browser does not support HTML video.
      </video>
    </div>

    <div class="dialog-details">
      <h2 id="dialog-title"></h2>

      <p>
        By <strong id="dialog-creator"></strong>
      </p>

      <img id="dialog-contact-qr" src="">
      <p id="dialog-contact"></p>

      <p id="dialog-description" class="description"></p>

      <p id="dialog-duration"></p>

      <button onclick="playCurrentVideo()">
        Play
      </button>
    </div>

  </div>
</dialog>
{{end}}
