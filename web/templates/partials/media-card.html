{{define "media-card"}}
<div class="card"
     hx-get="/dialog/{{.ID}}"
     hx-target="#media-dialog"
     hx-swap="outerHTML"
     hx-trigger="click"
     data-id="{{.ID}}"
     data-title="{{.Title}}"
     data-creator="{{.Artist}}"
     data-contact="{{.Contact}}"
     data-contact-qr="{{.ContactQR}}"
     data-post-credit="{{.PostCredit}}"
     data-description="{{.Description}}"
     data-image="{{.Thumbnail}}"
     data-video="{{.Video}}"
     data-preview="{{.Preview}}"
     data-duration="{{.Duration}}">
  <div class="card-body">
    <h2>{{.Title}}</h2>

    <img class="card-image"
         src="{{.Thumbnail}}"
         alt="{{.Title}}">
    <div class="card-infos">
      <p>By <strong>{{.Artist}}</strong></p>
      {{if .Duration}}
      <p>Runtime: {{.Duration}}</p>
      {{end}}
    </div>
  </div>
</div>
{{end}}
