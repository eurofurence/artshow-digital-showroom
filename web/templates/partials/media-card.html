{{define "media-card"}}
<div class="card"
     onclick="openMediaDialog(this)"
     data-title="{{.Title}}"
     data-creator="{{.Artist}}"
     data-description="{{.Description}}"
     data-image="{{.Thumbnail}}">
  <div class="card-body">
    <h2>{{.Title}}</h2>

    <img class="card-image"
         src="{{.Thumbnail}}"
         alt="{{.Title}}">
    <p>By <strong>{{.Artist}}</strong></p>
  </div>
</div>
{{end}}
