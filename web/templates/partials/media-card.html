{{define "media-card"}}
<div class="card"
     onclick="openMediaDialog(this)"
     data-title="{{.Title}}"
     data-creator="{{.Artist}}"
     data-contact="{{.Contact}}"
     data-contact-qr="{{.ContactQR}}"
     data-description="{{.Description}}"
     data-image="{{.Thumbnail}}"
     data-video="{{.Video}}"
     data-video-type="{{.VideoType}}"
     data-duration="{{.Duration}}">
  <div class="card-body">
    <h2>{{.Title}}</h2>

    <img class="card-image"
         src="{{.Thumbnail}}"
         alt="{{.Title}}">
    <p>By <strong>{{.Artist}}</strong></p>
    {{if .Duration}}
    <p>Runtime: {{.Duration}}</p>
    {{end}}
  </div>
</div>
{{end}}
