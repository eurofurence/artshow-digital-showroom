{{define "statusbar"}}
{{- if .Idle -}}
    <span class="status-dot idle"></span>
    Nothing playing
{{- else -}}
    <span class="status-dot playing"></span>
    <strong>{{.Title}}</strong>
    <span class="status-time">
        {{- formatDuration .Position -}}
        /
        {{- formatDuration .Duration -}}
    </span>
{{- end}}
{{- end -}}
