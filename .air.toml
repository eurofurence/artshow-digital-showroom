#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/start-server ./cmd"
  entrypoint = "./tmp/start-server"
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs"]
  include_ext = ["go", "tpl", "tmpl", "html", "css", "toml"]
  stop_on_error = true
